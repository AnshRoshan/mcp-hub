name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check          # typechecks + dead-code gate + unit tests + registry schema validation
      - run: npm run build && npm run build:web
      - run: node scripts/smoke.mjs
      - run: node scripts/smoke-platform.mjs
      - run: node scripts/smoke-ghjira.mjs
